<style>
/* =========================
   GLOBAL
========================= */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  -webkit-print-color-adjust: exact;
  scroll-behavior: smooth;
}

body {
  background: #0f172a;
  color: #e2e8f0;
  font-family: "Segoe UI", Arial, sans-serif;
  line-height: 1.8;
  max-width: 1100px;
  margin: auto;
  padding: 40px 28px;
}

/* =========================
   TYPOGRAPHY
========================= */

.page-title {
  font-size: 3rem;
  margin-bottom: 15px;
  color: #f8fafc;
  font-weight: 700;
  border-bottom: 2px solid #1e293b;
  padding-bottom: 20px;
}

h1,
h2,
h3,
h4 {
  color: #f8fafc;
  margin-top: 40px;
  margin-bottom: 18px;
  line-height: 1.3;
}

h1 {
  font-size: 2.3rem;
}

h2 {
  font-size: 1.8rem;
  border-left: 5px solid #38bdf8;
  padding-left: 14px;
}

h3 {
  font-size: 1.4rem;
  color: #7dd3fc;
}

h4 {
  font-size: 1.15rem;
  color: #cbd5e1;
}

p {
  margin: 14px 0;
  color: #cbd5e1;
}

/* =========================
   LINKS
========================= */

a {
  color: #38bdf8;
  text-decoration: none;
  transition: 0.2s ease;
}

a:hover {
  color: #7dd3fc;
  text-decoration: underline;
}

/* =========================
   CODE BLOCKS
========================= */

.code,
pre {
  background: #111827 !important;
  border: 1px solid #1e293b;
  border-radius: 14px;
  padding: 20px !important;
  overflow-x: auto;
  margin: 25px 0;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.02);
}

code {
  font-family: "JetBrains Mono", monospace;
  color: #7dd3fc;
  background: rgba(56, 189, 248, 0.12);
  padding: 3px 7px;
  border-radius: 6px;
  font-size: 0.95rem;
}

pre code {
  background: transparent;
  padding: 0;
  color: #e2e8f0;
  font-size: 0.95rem;
}

/* =========================
   IMAGES
========================= */

.image img,
figure img {
  width: 100%;
  border-radius: 16px;
  border: 1px solid #1e293b;
  transition: transform 0.25s ease;
  box-shadow:
    0 10px 25px rgba(0,0,0,0.35),
    0 0 0 1px rgba(255,255,255,0.03);
}

.image img:hover,
figure img:hover {
  transform: scale(1.01);
}

figure {
  margin: 35px 0;
}

figcaption {
  text-align: center;
  margin-top: 12px;
  color: #94a3b8;
  font-size: 0.92rem;
}

/* =========================
   BLOCKQUOTES
========================= */

blockquote {
  border-left: 4px solid #38bdf8;
  background: #111827;
  padding: 18px 22px;
  margin: 25px 0;
  border-radius: 12px;
  color: #cbd5e1;
}

/* =========================
   TABLES
========================= */

table {
  width: 100%;
  border-collapse: collapse;
  margin: 30px 0;
  overflow: hidden;
  border-radius: 12px;
}

th {
  background: #1e293b;
  color: #f8fafc;
  font-weight: 600;
}

td,
th {
  border: 1px solid #334155;
  padding: 14px;
}

td {
  background: #0f172a;
  color: #cbd5e1;
}

/* =========================
   LISTS
========================= */

ul,
ol {
  padding-left: 25px;
  margin: 18px 0;
}

li {
  margin-bottom: 10px;
  color: #cbd5e1;
}

/* =========================
   HR
========================= */

hr {
  border: none;
  height: 1px;
  background: #1e293b;
  margin: 50px 0;
}

/* =========================
   CALLOUTS
========================= */

.callout {
  background: #111827;
  border: 1px solid #1e293b;
  border-left: 5px solid #38bdf8;
  padding: 20px;
  border-radius: 14px;
  margin: 25px 0;
}

/* =========================
   TOC LINKS
========================= */

.table_of_contents-link {
  color: #94a3b8;
  border-bottom: 1px solid #334155;
}

.table_of_contents-link:hover {
  color: #38bdf8;
}

/* =========================
   SCROLLBAR
========================= */

::-webkit-scrollbar {
  width: 10px;
}

::-webkit-scrollbar-track {
  background: #0f172a;
}

::-webkit-scrollbar-thumb {
  background: #334155;
  border-radius: 10px;
}

::-webkit-scrollbar-thumb:hover {
  background: #475569;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 768px) {
  body {
    padding: 24px 18px;
  }

  .page-title {
    font-size: 2.2rem;
  }

  h2 {
    font-size: 1.5rem;
  }

  pre {
    padding: 16px !important;
  }
}
</style>
